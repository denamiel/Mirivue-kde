name: RPM Fedora et documentation installée
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publier_copr:
        description: 'Pour publier dans COPR le commit main testé, taper exactement PUBLIER'
        required: false
        default: ''
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  rpm:
    name: RPM KDE Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora: '44'
            experimental: false
          - fedora: '45'
            experimental: false
          - fedora: rawhide
            experimental: true
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Préparer Fedora
        run: dnf -y install git rpm-build python3 dnf5-plugins xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon python3-pyyaml python3-rpm
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construire le RPM avec ses contrôles natifs
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          dnf -y builddep packaging/fedora/mirivue-kde.spec
          bash packaging/fedora/Preparer-Sources.sh
          rpmbuild -ba --define "_sourcedir $PWD/packaging/fedora" --define "_rpmdir $PWD/dist/rpms" --define "_srcrpmdir $PWD/dist/srpms" --define "_smp_build_ncpus 2" packaging/fedora/mirivue-kde.spec
      - name: Installer et vérifier les guides et le lancement
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dnf -y --setopt=tsflags= install dist/rpms/x86_64/*.rpm
          test "$(rpm -q --qf '%{RELEASE}' mirivue-kde)" = "$(rpmspec -q --srpm --qf '%{RELEASE}' packaging/fedora/mirivue-kde.spec)"
          for document in README.md LISEZ-MOI-KDE.txt packaging/README.md packaging/fedora/PUBLICATION.md; do
            cmp "$document" "/usr/share/doc/mirivue-kde/$document"
          done
          python3 packaging/check_python_runtime.py
          cd /tmp
          mirivue-kde --version
          dbus-run-session -- timeout 45 mirivue-kde --smoke-test
      - name: Régressions graphiques transferts, fermeture et sessions
        env:
          QT_QPA_PLATFORM: offscreen
          MIRIVUE_TEST_PRIVATE_TMPFS: "1"
        run: |
          mkdir -p tools
          cp -a /usr/lib64/mirivue-kde/tools/. tools/
          export XDG_STATE_HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export PYTHONPATH="$PWD:$PWD/tests"
          for suite in native_file_management_gui background_close_gui panel_transfers_gui session_edge_cases_gui transfer_selection_gui dolphin_parity_gui remaining_parity_gui context_rename_gui kio_progress_routing_gui transfer_thumbnail_refresh native_kio_transfers_integration native_clipboard_gui c1_h1_h2_regressions delete_action_state publication_controlee protection_main; do
            dbus-run-session -- timeout 180 python3 -m unittest discover -s tests -p "test_${suite}.py" -v
          done
      - name: Signaler une incompatibilité de développement
        if: failure() && matrix.experimental
        run: echo 'Rawhide a échoué. Examiner les dépendances et les tests avant la prochaine migration ; aucun paquet Rawhide n’est publié.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success() && !matrix.experimental
        with:
          name: rpm-kde-fedora-${{ matrix.fedora }}
          path: dist/rpms/x86_64/*.rpm
          if-no-files-found: error

  testlab:
    name: TestLab — vraie fenêtre sous Xvfb (Fedora 45)
    # Starts the installed RPM in a disposable X11 session (Xvfb, private
    # D-Bus, disposable HOME/XDG/Trash) as a dedicated unprivileged account.
    # Mandatory before a COPR publication. It is not a Plasma Wayland validation.
    needs: rpm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:45
      # An init process reaps the processes that TestLab kills.
      options: --init
    permissions:
      contents: read
    env:
      MIRIVUE_TESTLAB_USER: mirivue-testlab
      MIRIVUE_TESTLAB_REQUIRE_DISPLAY: '1'
      MIRIVUE_TESTLAB_REQUIRE_CONFINEMENT: '1'
    steps:
      - name: Préparer la session graphique jetable et le compte de test
        run: |
          dnf -y install python3 xorg-x11-server-Xvfb xdotool xwd xclip dbus-daemon shadow-utils
          # No home, no shell, no group membership: it owns only the disposable roots.
          useradd --system --no-create-home --home-dir /nonexistent --shell /sbin/nologin "$MIRIVUE_TESTLAB_USER"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rpm-kde-fedora-45
          path: dist/rpms
      - name: Installer le RPM testé
        run: dnf -y --setopt=tsflags= install dist/rpms/*.rpm
      - name: Tests du harness (succès, échec, délai, confinement, nettoyage)
        run: timeout 600 python3 -m unittest discover -s tests -p test_testlab_harness.py -v
      - name: Scénario de bout en bout — nouveau dossier au clavier (3 exécutions)
        run: |
          # The CI HOME stands in for a personal folder and must stay unchanged.
          mkdir -p "$HOME/.config" "$HOME/.local/share"
          for run in 1 2 3; do
            timeout 300 python3 tests/testlab/run.py nouveau-dossier \
              --artefacts "testlab-artefacts/nouveau-dossier-$run" --surveiller "$HOME"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testlab-fedora-45
          path: testlab-artefacts
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Python ${{ matrix.python }} — imports et fichiers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Installer les dépendances déclarées
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libpulse0 libasound2t64
          python -c 'import subprocess, sys, tomllib; dependencies = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]; subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])'
      - name: Vérifier le fonctionnement Python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/check_python_runtime.py

  publish:
    name: Publier dans COPR après les contrôles obligatoires
    # Publication uniquement sur demande explicite : lancement manuel sur main,
    # confirmation tapée, puis approbation dans l'environnement protégé.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.publier_copr == 'PUBLIER'
    # TestLab is mandatory: a failed graphical test blocks the publication.
    needs: [rpm, python, testlab]
    runs-on: ubuntu-latest
    environment: publication-copr
    permissions:
      contents: write
    concurrency:
      group: copr-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Avancer uniquement la version testée sans écraser la publication
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main publication
          # A newer main commit must pass its own checks before publication.
          if [ "$(git rev-parse origin/main)" != "$TESTED_COMMIT" ]; then
            echo 'Une version plus récente attend sa propre validation.'
            exit 0
          fi
          git merge-base --is-ancestor origin/publication "$TESTED_COMMIT"
          # Refuse an equal or lower RPM Epoch:Version-Release (rpmvercmp).
          git show origin/publication:packaging/fedora/mirivue-kde.spec > "$RUNNER_TEMP/publie.spec"
          git show "$TESTED_COMMIT:packaging/fedora/mirivue-kde.spec" > "$RUNNER_TEMP/candidat.spec"
          python3 packaging/fedora/verifier-revision-publication.py "$RUNNER_TEMP/publie.spec" "$RUNNER_TEMP/candidat.spec"
          git push origin "$TESTED_COMMIT:refs/heads/publication"
