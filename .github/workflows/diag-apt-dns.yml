name: Diagnostic apt/DNS des images runner (temporaire)
# Diagnostic ponctuel, sans secret, à supprimer après validation du correctif.
# - job « diag » : compare ubuntu-24.04 et ubuntu-26.04 (résolveur local et résolveurs publics).
# - job « repli » : teste packaging/ci_apt_install.sh dans trois scénarios (normal, repli
#   déclenché, échec persistant contrôlé) en bloquant le port 53 par iptables sur le
#   runner éphémère (règles retirées en fin de test). Aucune variable d'environnement,
#   aucun secret ni jeton n'est lu ou affiché.
on:
  pull_request:
    paths:
      - '.github/workflows/diag-apt-dns.yml'
      - 'packaging/ci_apt_install.sh'
permissions:
  contents: read
jobs:
  diag:
    name: apt/DNS sur ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Résolveur local contre résolveurs publics
        run: |
          h=azure.archive.ubuntu.com
          printf '%s (local) -> ' "$h"; getent hosts "$h" | head -n 1 || echo 'non résolu'
          for srv in 168.63.129.16 1.1.1.1; do
            echo "--- serveur $srv"
            timeout 8 python3 - "$srv" "$h" <<'PY' || echo 'ECHEC (aucune réponse)'
          import socket, struct, sys
          srv, nom = sys.argv[1], sys.argv[2]
          q = struct.pack('>HHHHHH', 0x1234, 0x0100, 1, 0, 0, 0)
          q += b''.join(bytes([len(p)]) + p.encode() for p in nom.split('.')) + b'\0' + struct.pack('>HH', 1, 1)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(5)
          s.sendto(q, (srv, 53))
          r = s.recv(512)
          print('rcode', r[3] & 15, '; réponses :', struct.unpack('>H', r[6:8])[0])
          PY
          done

  repli:
    name: repli DNS (${{ matrix.scenario }}) sur ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
        scenario: [normal, repli, echec]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scénario ${{ matrix.scenario }}
        shell: bash
        run: |
          set -uo pipefail
          scenario='${{ matrix.scenario }}'
          iface=$(ip -o route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -n1)
          avant=$(resolvectl dns "$iface")
          echo "DNS avant : $avant"
          regles=()
          bloquer() {  # $@ : arguments iptables de sélection
            for p in udp tcp; do sudo iptables -I OUTPUT -p "$p" --dport 53 "$@" -j DROP && regles+=("$p|$*"); done
          }
          case "$scenario" in
            repli) bloquer '!' -d 1.1.1.1 ;;   # le résolveur Azure est « muet », 1.1.1.1 joignable
            echec) bloquer ;;                  # plus aucun DNS sortant
          esac
          sudo resolvectl flush-caches
          export CI_APT_DNS_TENTATIVES=2 CI_APT_DNS_PAUSE=2
          code=0
          bash packaging/ci_apt_install.sh libegl1 > sortie.log 2>&1 || code=$?
          # Retrait des règles de test, quoi qu'il se soit passé.
          for r in "${regles[@]}"; do
            p=${r%%|*}; a=${r#*|}
            # shellcheck disable=SC2086
            sudo iptables -D OUTPUT -p "$p" --dport 53 $a -j DROP
          done
          sudo iptables -S OUTPUT | grep -c -e 'dport 53' || true
          apres=$(resolvectl dns "$iface")
          cat sortie.log
          echo "code=$code ; DNS après : $apres"
          erreurs=0
          [ "$avant" = "$apres" ] || { echo 'ERREUR : DNS non restauré à l identique'; erreurs=1; }
          spontane=0; grep -q 'REPLI DNS ACTIVÉ' sortie.log && spontane=1
          case "$scenario" in
            normal) [ "$code" = 0 ] || { echo 'ERREUR : le cas normal doit réussir'; erreurs=1; }
                    echo "repli déclenché spontanément dans le cas normal : $spontane" ;;
            repli)  [ "$code" = 0 ] && [ "$spontane" = 1 ] || { echo 'ERREUR : repli attendu et succès'; erreurs=1; } ;;
            echec)  [ "$code" != 0 ] && grep -q 'échec persistant' sortie.log || { echo 'ERREUR : échec contrôlé attendu (job rouge + diagnostic)'; erreurs=1; } ;;
          esac
          exit "$erreurs"
